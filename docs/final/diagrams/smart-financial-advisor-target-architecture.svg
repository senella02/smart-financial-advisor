  <use xlink:href="#logo-vercel" x="552" y="293" width="28" height="28" aria-hidden="true"/>
  <text x="62" y="295" class="section">INTERACTIVE REQUESTS</text>
  <text x="62" y="330" class="name">Next.js on Vercel</text>
  <text x="62" y="361" class="body">Serves the UI and API, resolves financial context, and checks access</text>
  <line x1="62" y1="381" x2="598" y2="381" stroke="#bdd0e3"/>
  <text x="62" y="410" class="body">Proposed Supabase Auth for sign-in</text>
  <text x="62" y="438" class="body">Market data, events and FX via server adapters</text>
  <text x="62" y="466" class="body">Model via Vercel AI SDK · Private inputs require approval</text>
  <text x="62" y="494" class="body">Resolves public evidence and validates citations</text>

  <rect x="1327" y="282" width="50" height="50" rx="11" class="icon-tile"/>
  <use xlink:href="#logo-airflow" x="1335" y="290" width="34" height="34" aria-hidden="true"/>
  <text x="856" y="295" class="section">BACKGROUND WORK</text>
  <text x="856" y="330" class="name">Apache Airflow</text>
  <text x="856" y="361" class="body">Schedules news, filings and the hourly Daily Brief</text>
  <line x1="856" y1="381" x2="1378" y2="381" stroke="#bfd8ce"/>
  <text x="856" y="410" class="body">Extracts and indexes evidence, supports backfills and reindexing</text>
  <text x="856" y="438" class="body">Dispatches first-open summaries and recovers interrupted jobs</text>
  <text x="856" y="466" class="body">TypeScript worker publishes Thai and English together</text>
  <text x="856" y="494" class="body">Model via Vercel AI SDK · Public evidence only</text>

