<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title description">
  <title id="title">Figure 1. Smart Financial Advisor system architecture</title>
  <desc id="description">The full product target design. Guests and signed-in investors use Next.js on Vercel. Next.js reads account-private records and public evidence and triggers first-open stock summaries in Airflow. Airflow schedules ingestion, indexing, and publication using public evidence only. Supabase PostgreSQL holds private account records separately from public evidence and publications. Pinecone indexes public passages for scoped retrieval.</desc>
