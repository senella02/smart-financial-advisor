  <text x="727" y="364" class="edge" text-anchor="middle">Durable job ID</text>
  <text x="727" y="405" class="edge" text-anchor="middle">Authenticated REST API</text>

  <rect x="481" y="282" width="50" height="50" rx="11" class="icon-tile"/>
  <use xlink:href="#logo-nextjs" x="491" y="292" width="30" height="30" aria-hidden="true"/>
